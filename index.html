<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>麹LIFE WELL-BEING</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="麹LIFE WELL-BEING｜麹と発酵のある上質な暮らしを提案するブランドサイト。" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Zen+Old+Mincho:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-main: #F4F1EA;
      --bg-sub: #ECE9E0;
      --text-main: #2A2A2A;
      --accent: #B87333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }

    .font-serif-en { font-family: 'Cormorant Garamond', serif; }
    .font-serif-jp { font-family: 'Zen Old Mincho', serif; }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      padding: 1.5rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }
    @media (min-width: 768px) {
      header { padding: 1.5rem 3rem; }
    }
    header h1 {
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      font-weight: 700;
    }
    .menu-button {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      background: none;
      border: none;
      color: inherit;
      font: inherit;
    }
    .menu-label {
      display: none;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
    }
    @media (min-width: 768px) {
      .menu-label { display: inline-block; }
    }
    .menu-icon {
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .menu-icon span,
    .menu-icon span::before,
    .menu-icon span::after {
      content: "";
      display: block;
      width: 18px;
      height: 2px;
      background: #fff;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .menu-icon span::before { transform: translateY(-6px); }
    .menu-icon span::after { transform: translateY(6px); }
    .menu-icon.is-open span { opacity: 0; }
    .menu-icon.is-open span::before { transform: translateY(0) rotate(45deg); }
    .menu-icon.is-open span::after { transform: translateY(0) rotate(-45deg); }

    /* Mobile Menu */
    .menu-overlay {
      position: fixed;
      inset: 0;
      background: #2A2A2A;
      color: #F4F1EA;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-100%);
      transition: transform 0.4s ease;
      z-index: 40;
    }
    .menu-overlay.is-open { transform: translateY(0); }
    .menu-overlay nav a {
      display: block;
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      font-family: 'Cormorant Garamond', serif;
      letter-spacing: 0.2em;
    }
    .menu-overlay nav a:last-child { margin-bottom: 0; }

    /* Hero */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
      text-align: center;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transform: scale(1.1);
      transition: transform 0.3s ease;
    }
    .hero-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
    }
    .hero-inner {
      position: relative;
      z-index: 1;
      padding: 0 1.5rem;
    }
    .hero-en {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      margin-bottom: 1rem;
      opacity: 0.9;
    }
    @media (min-width: 768px) {
      .hero-en { font-size: 0.9rem; }
    }
    .hero-title {
      font-size: 2.4rem;
      line-height: 1.4;
      letter-spacing: 0.15em;
      margin-bottom: 2rem;
    }
    @media (min-width: 768px) {
      .hero-title { font-size: 4rem; }
    }
    @media (min-width: 1024px) {
      .hero-title { font-size: 4.8rem; }
    }
    .hero-line {
      width: 1px;
      height: 80px;
      margin: 0 auto;
      background: rgba(255,255,255,0.7);
    }

    /* Sections */
    section { scroll-margin-top: 80px; }

    /* Philosophy */
    .section-philo {
      padding: 4rem 0 3rem;
    }
    @media (min-width: 768px) {
      .section-philo { padding: 6rem 0 4rem; }
    }
    .philo-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      align-items: center;
    }
    @media (min-width: 900px) {
      .philo-grid {
        grid-template-columns: 5fr 7fr;
        gap: 4rem;
      }
    }
    .philo-label {
      color: var(--accent);
      font-style: italic;
      margin-bottom: 0.75rem;
    }
    .philo-lead {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      white-space: pre-line;
    }
    @media (min-width: 768px) {
      .philo-lead { font-size: 2.6rem; }
    }
    .philo-text {
      font-size: 0.9rem;
      opacity: 0.9;
      text-align: justify;
    }
    .philo-readmore {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 2rem;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      border-bottom: 1px solid var(--text-main);
      padding-bottom: 0.2rem;
    }
    .philo-readmore:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .philo-image-wrap {
      position: relative;
    }
    .philo-main-img {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4/5;
      background: #fff;
    }
    .philo-main-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      transition: transform 2s ease-out;
    }
    .philo-main-img:hover img { transform: scale(1.06); }
    .philo-circle {
      position: absolute;
      top: -40px;
      left: -40px;
      width: 80px;
      height: 80px;
      border-radius: 999px;
      border: 1px solid rgba(184,115,51,0.3);
      display: none;
    }
    @media (min-width: 900px) {
      .philo-circle { display: block; }
    }
    .philo-card {
      display: none;
    }
    @media (min-width: 900px) {
      .philo-card {
        display: block;
        position: absolute;
        left: -96px;
        bottom: -48px;
        background: #fff;
        padding: 1.75rem 2rem;
        max-width: 240px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.18);
      }
    }
    .philo-card p {
      font-size: 0.8rem;
      line-height: 1.8;
    }

    /* Dotted divider */
    .divider {
      width: 100%;
      height: 130px;
      opacity: 0.1;
      background-image: radial-gradient(#2A2A2A 1px, transparent 1px);
      background-size: 20px 20px;
    }
    @media (min-width: 768px) {
      .divider { height: 190px; }
    }

    /* Products */
    .section-products {
      background: var(--bg-sub);
      padding: 4rem 0;
